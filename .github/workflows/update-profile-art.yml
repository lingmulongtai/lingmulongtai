name: Update profile art

# Refreshes the contribution graph, stats card and achievements panel from real
# data every day.
# The ASCII portrait is rendered by hand (scripts/render_portrait.py).

on:
  schedule:
    - cron: "23 15 * * *" # 00:23 JST, just after the day closes in Japan
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render contribution graph
        run: python scripts/render_heatmap.py

      - name: Render stats card
        run: python scripts/render_stats.py

      - name: Fetch achievements
        run: python scripts/fetch_achievements.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render achievements panel
        run: python scripts/render_achievements.py

      - name: Commit refreshed art
        run: |
          git add data/contributions.json data/achievements.json assets/contrib-heatmap.svg assets/stats.svg assets/achievements.svg
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile art [skip ci]"
          git push
